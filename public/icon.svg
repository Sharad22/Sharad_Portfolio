<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081226"/>
      <stop offset="60%" stop-color="#0F2B5B"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner Subtle Border -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Ambient Glow Center -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)"/>

  <!-- Central Graphic (Inside 80% Safe Zone for Maskable Compatibility) -->
  <g transform="translate(256, 256)">
    <!-- Designer Orbit Ring -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="12 12"/>

    <!-- Geometric Stylized 'S' and 'G' Interlocking Monogram -->
    <!-- 'S' Shape -->
    <path d="M 40 -85 C -20 -85, -60 -50, -60 -15 C -60 25, 60 15, 60 55 C 60 85, 20 95, -35 95 C -55 95, -70 88, -80 78" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="26" 
          stroke-linecap="round"
          filter="url(#softGlow)"/>

    <!-- 'G' Complement Shape -->
    <path d="M 10 -40 C 45 -40, 75 -20, 75 20 C 75 65, 35 95, -15 95" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="22" 
          stroke-linecap="round"/>

    <path d="M 75 20 L 25 20" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="22" 
          stroke-linecap="round"/>

    <!-- Glowing Vector Node (Product Design Anchor) -->
    <circle cx="40" cy="-85" r="9" fill="#38BDF8"/>
    <circle cx="40" cy="-85" r="15" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6"/>

    <circle cx="-35" cy="95" r="9" fill="#818CF8"/>
    <circle cx="-35" cy="95" r="15" fill="none" stroke="#818CF8" stroke-width="2" stroke-opacity="0.6"/>
  </g>
</svg>
